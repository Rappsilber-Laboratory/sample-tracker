{% extends "base.html" %}
{% block title %}{{ instrument.name }}{% endblock %}
{% block content %}
<h2>{{ instrument.name }}</h2>
<p>
  <a href="{{ url_for('instrument_edit', initial=instrument.initial) }}">Edit</a>
  &middot;
  <a href="{{ url_for('instrument_list') }}">Back to Instruments</a>
</p>
<table>
  <tbody>
    <tr><th>Name</th><td>{{ instrument.name }}</td></tr>
    <tr><th>Initial</th><td>{{ instrument.initial }}</td></tr>
    <tr><th>Model</th><td>{{ instrument.model or '—' }}</td></tr>
  </tbody>
</table>
{% endblock %}
